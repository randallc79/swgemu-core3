name: Build Core3 Prebuilt Image

on:
  workflow_dispatch:
  push:
    branches:
      - unstable

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prebuilt image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/randallc79/swgemu-core3:prebuilt
