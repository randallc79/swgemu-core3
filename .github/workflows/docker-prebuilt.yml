name: Build Core3 Prebuilt Image

on:
  push:
    branches: 
      - unstable
    paths:
      - docker/Dockerfile.prebuilt
      - .github/workflows/docker-prebuilt.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push prebuilt image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: docker/Dockerfile.prebuilt
          push: true
          tags: |
            ghcr.io/randallc79/swgemu-core3:prebuilt
